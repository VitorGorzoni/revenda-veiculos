spring:
  application:
    name: revenda-veiculos

  # Database Configuration for Docker
  datasource:
    url: jdbc:mysql://mysql:3306/revenda_veiculos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Server Configuration
server:
  port: 8080

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging Configuration - APENAS CONSOLE NO DOCKER
logging:
  level:
    org.com: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  # Desabilita o arquivo de log customizado - usa apenas console
  config: classpath:logback-docker.xml
